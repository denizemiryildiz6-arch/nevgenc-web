<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f9fd">
  <meta name="description" content="NevGenç — Sakarya'daki öğrenciler için topluluklar, fırsatlar, kampüs ve şehir haritası.">
  <title>NevGenç</title>
  <link rel="icon" href="assets/img/nevgenc-logo.png">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div id="app-shell" class="app-shell">
    <header class="topbar">
      <a class="brand" href="#/anasayfa" aria-label="NevGenç Ana Sayfa">
        <img src="assets/img/nevgenc-logo.png" alt="NevGenç logosu">
        <span>NevGenç</span>
      </a>
      <div class="topbar-actions">
        <button class="top-icon" type="button" id="global-search-button" aria-label="Ara">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        </button>
        <button class="top-icon" type="button" id="notifications-button" aria-label="Bildirimler">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 6-2.5 7-2.5 9h17c0-2-2.5-3-2.5-9Z"/><path d="M10 21h4"/></svg>
        </button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Ana navigasyon">
      <a class="nav-item" href="#/anasayfa" data-route="anasayfa">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
        <span>Ana Sayfa</span>
      </a>
      <a class="nav-item" href="#/topluluklar" data-route="topluluklar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c.4-4.1 2.4-6.2 5.5-6.2s5.1 2.1 5.5 6.2"/><circle cx="17.2" cy="9" r="2.4"/><path d="M16.3 14.6c2.8.2 4.3 2 4.6 5.4"/></svg>
        <span>Topluluklar</span>
      </a>
      <a class="nav-item map-nav" href="#/harita" data-route="harita">
        <span class="map-nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11Z"/><circle cx="12" cy="10" r="2"/></svg></span>
        <span>Harita</span>
      </a>
      <a class="nav-item" href="#/firsatlar" data-route="firsatlar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2.2"/><path d="M8 7V5.5A2.5 2.5 0 0 1 10.5 3h3A2.5 2.5 0 0 1 16 5.5V7"/><path d="M3 12h18"/><path d="M10 12v2h4v-2"/></svg>
        <span>Fırsatlar</span>
      </a>
      <a class="nav-item" href="#/profil" data-route="profil">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 21c.6-4.6 3.1-7 7.5-7s6.9 2.4 7.5 7"/></svg>
        <span>Profil</span>
      </a>
    </nav>
  </div>

  <div class="search-overlay" id="search-overlay" hidden>
    <div class="search-dialog" role="dialog" aria-modal="true" aria-labelledby="search-title">
      <div class="search-head">
        <div><span class="eyebrow">NEVGENÇ</span><h2 id="search-title">Ara</h2></div>
        <button class="top-icon" type="button" id="search-close" aria-label="Kapat">×</button>
      </div>
      <label class="search-input-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="global-search-input" type="search" placeholder="Topluluk, işletme veya fırsat ara…" autocomplete="off">
      </label>
      <div id="global-search-results" class="search-results"></div>
    </div>
  </div>

  <div class="login-overlay" id="login-overlay" hidden>
    <div class="login-dialog" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <div class="login-brand">
        <img src="assets/img/nevgenc-logo.png" alt="NevGenç logosu">
        <span>NevGenç</span>
      </div>
      <span class="eyebrow">KULLANICI GİRİŞİ</span>
      <h2 id="login-title">NevGenç’e hoş geldin</h2>
      <p id="login-copy">Devam etmek için yalnızca adını girmen yeterli. Şifre istenmez.</p>
      <form id="login-form" novalidate>
        <label class="login-field">
          <span>Ad Soyad</span>
          <input id="login-name" name="name" type="text" maxlength="60" autocomplete="name" placeholder="Örn. Deniz Emir Yıldız" required>
        </label>
        <div class="login-error" id="login-error" aria-live="polite"></div>
        <button class="button primary login-submit" id="login-submit" type="submit">Devam Et</button>
      </form>
      <p class="login-note">Bu sürümde giriş adı yalnızca bu cihazda saklanır. Hesap doğrulaması veya parola kullanılmaz.</p>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/data/official-data.js"></script>
  <script src="assets/js/data/announcements.js"></script>
  <script src="assets/js/data/seed.js"></script>
  <script src="assets/js/services/supabase.js"></script>
  <script src="assets/js/services/session.js"></script>
  <script src="assets/js/services/repositories.js"></script>
  <script src="assets/js/map.js"></script>
  <script src="assets/js/views.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
